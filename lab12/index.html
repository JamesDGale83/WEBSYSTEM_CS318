<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Creator</title>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Eater&family=Montserrat:wght@700&display=swap" rel="stylesheet">

</head>
<body>
    <header>
        <h1>Monster Creator</h1>

    </header>

    <main>
        <form action="https://theresahanson.com/monster-creator" method="post" enctype="multipart/form-data">
            <label for="Monster-Name">
                Monster Name
                <input type="text" id="Monster-Name" name="Monster-name">
            </label>

            <label for="Monster-email">
                Monster e-mail
                <input type="email" id="Monster-email" name="Monster-email" value="@monsteremail.com">
            </label>

            <label for="Monster-birthday">
                Monster Birthday
                <input type="date" id="Monster-birthday" name="Monster-birthday">
            </label>

            <fieldset>
                <legend >Scary
                
                </legend>
                    <label for="Scary-yes">Yes!
                        <input type="radio" id="Scary-yes" value="Yes!">
                    </label>
                    <label for="Scary-no">No
                        <input type="radio" id="Scary-no" value="No">
                    </label>

                
            </fieldset>

            <label for="color">Color of Monster</label>
            <input type="color" id="color" name="monster-color">

            <label for="tenacles"> Number of Tentacles</label>
            <input type="number" id="tenacles" name="Monster-tentacles" value="0" min="0" max="1000000">

            <label for="picture">Picture of Monster</label>
            <input type="file" id="picture" name="monster-picture" accept="images/*">

            <label for="eyes">"Number of Eyeballs</label>
            <input type="number" id="eyes" name=" monster-eyes" min="0" max="22">

            <label for="Creator">Monster's Creator</label>
            <input type="text" id="Creator" name="monster-creator" value="Your Names Hear">

            <div class="actions">
                <input type="reset">
                <input type="submit">
            </div>

        </form>

    </main>
    
    <footer>

    </footer>




</body>
</html>
